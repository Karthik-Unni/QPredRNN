# PredRNN-V2 — Final 50-Epoch Full-Dataset Training Configuration
# Run ID: kth_predrnn_v2_final_50ep
#
# Scientific justification:
#   - max_train_batches is explicitly null (no cap) so every epoch processes
#     all 28,389 training windows at batch_size=8 → 3,549 batches/epoch.
#   - batch_size=8 chosen to match ConvLSTM for controlled comparison.
#   - VRAM budget: PredRNN-V2 has 15,361 parameters (hidden=8, 2 layers).
#     At bs=8 with 10x10x1x64x64 tensors this fits well within 6 GB.
#   - Decoupling loss weight=0.1 follows the original PredRNN-V2 paper.
#   - Reverse Scheduled Sampling schedule scaled to full-dataset steps:
#       r_sampling_step_1 = 25000  (= 50ep * 500 steps — kept to match
#         the QPredRNN capped run for RSS phase comparability)
#       r_sampling_step_2 = 225000 (= 9x step_1, standard linear phase)
#       Alternatively use 50*3549=177450 full-dataset steps and set
#       step_1=25000, step_2=177450 to remain comparable.
#   - Same preprocessing, normalization, splits as other final runs.
#   - Checkpoint selection: best validation MSE.
#
# Full-dataset epoch definition:
#   train_windows=28389  batch_size=8  -> batches_per_epoch=3549  (uncapped)
#   val_windows=29666    batch_size=8  -> val_batches_per_epoch=3709 (uncapped)
#   total_train_passes=50 * 28389 = 1,419,450 windows

seed: 7
data_root: data/processed/kth64
run_dir: runs/kth_predrnn_v2_final_50ep
model:
  name: predrnn_v2
  image_channels: 1
  hidden_channels: 8
  num_layers: 2
  input_frames: 10
  output_frames: 10
  kernel_size: 3
  decouple_loss_weight: 0.1
training:
  epochs: 50
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  max_train_batches: null
  max_val_batches: null
  reverse_scheduled_sampling:
    enabled: true
    r_sampling_step_1: 25000
    r_sampling_step_2: 177450
    r_exp_alpha: 5.0
data:
  image_size: 64
  input_frames: 10
  output_frames: 10
  stride: 2
